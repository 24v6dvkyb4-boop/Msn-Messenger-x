<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>MSN Messenger</title>
    <link rel="stylesheet" href="https://unpkg.com/xp.css">
    <style>
        /* --- STYLES GÉNÉRAUX --- */
        body {
            background-color: #5a7edc; /* Fond bleu XP */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: "Tahoma", sans-serif;
            font-size: 11px;
            overflow: hidden;
        }

        /* --- FENÊTRE PRINCIPALE (LISTE DE CONTACTS) --- */
        .msn-window {
            width: 320px;
            height: 550px;
            background-color: #eef3fc;
            display: flex;
            flex-direction: column;
            border: 1px solid #003399;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }

        /* Barre de titre */
        .title-bar {
            background: linear-gradient(to bottom, #f5f9ff, #d6e5f7);
            padding: 3px 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #a0b9d9;
            font-weight: bold;
            color: #003399;
            font-size: 11px;
        }
        .title-bar-controls { display: flex; gap: 2px; }
        .title-bar-controls button {
            width: 16px; height: 14px; border: 1px solid #7a9cd6; background: #eef3fc; font-size: 9px; cursor: pointer;
        }

        /* Menu Bar */
        .menu-bar {
            background-color: #eef3fc;
            border-bottom: 1px solid #d4dbe8;
            display: flex;
            padding: 2px 5px;
            font-size: 11px;
            color: #000;
        }
        .menu-item { padding: 2px 8px; cursor: pointer; }
        .menu-item:hover { background-color: #d6e5f7; }

        /* En-tête (Profil) avec la vraie image du bonhomme MSN */
        .msn-header {
            background: linear-gradient(to bottom, #eef6ff, #dce9f9);
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #a0b9d9;
        }
        .user-pic {
            width: 48px; height: 48px;
            border: 1px solid #7a9cd6;
            background-color: #fff;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        .user-pic img { width: 100%; height: 100%; object-fit: cover; }
        
        .user-info { display: flex; flex-direction: column; gap: 2px; }
        .user-name { font-weight: bold; color: #003399; font-size: 12px; }
        .user-status { color: #333; font-size: 11px; }

        /* Barre de recherche */
        .search-bar { padding: 5px; background: #f5f9ff; border-bottom: 1px solid #d4dbe8; }
        .search-bar input {
            width: 100%; border: 1px solid #7f9db9; padding: 3px; font-size: 11px; font-family: "Tahoma", sans-serif;
        }

        /* Liste des contacts */
        .contact-list { flex: 1; background: #fff; overflow-y: auto; padding: 5px; }
        .contact-group {
            font-weight: bold; color: #555; margin-bottom: 5px; padding-left: 5px;
            background-color: #eef3fc; border-bottom: 1px solid #d4dbe8; font-size: 11px;
        }
        .contact-item {
            display: flex; align-items: center; gap: 8px; padding: 4px; cursor: pointer;
            border: 1px solid transparent; font-size: 11px;
        }
        .contact-item:hover { background-color: #d6e5f7; border: 1px solid #a0b9d9; }
        
        /* Icônes de statut (Vrai look MSN) */
        .status-icon { width: 16px; height: 16px; display: inline-block; }
        .status-online { background: url('https://upload.wikimedia.org/wikipedia/commons/8/8e/Msn_online.png') no-repeat center center; background-size: contain; }
        .status-away { background: url('https://upload.wikimedia.org/wikipedia/commons/2/2c/Msn_away.png') no-repeat center center; background-size: contain; }
        .status-offline { background: url('https://upload.wikimedia.org/wikipedia/commons/6/6e/Msn_offline.png') no-repeat center center; background-size: contain; }

        /* Barre de statut en bas */
        .status-bar {
            background: #eef3fc; border-top: 1px solid #a0b9d9; padding: 2px 5px;
            display: flex; justify-content: space-between; font-size: 10px; color: #333;
        }

        /* --- FENÊTRE DE CONVERSATION (LE CHAT) --- */
        .chat-window {
            display: none;
            width: 450px;
            height: 450px;
            position: absolute;
            top: 10%;
            left: 50%;
            background-color: #eef3fc;
            border: 1px solid #003399;
            flex-direction: column;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }
        .chat-menu-bar {
            background-color: #eef3fc; border-bottom: 1px solid #d4dbe8;
            display: flex; padding: 2px 5px; font-size: 11px;
        }
        .chat-messages {
            flex: 1; background: #fff; overflow-y: auto; padding: 8px;
            border: 1px solid #7f9db9; margin: 5px; font-size: 12px; font-family: "Tahoma", sans-serif;
        }
        .message { margin-bottom: 5px; }
        .message strong { color: #003399; }
        .message .time { color: #888; font-size: 10px; margin-right: 5px; }

        .chat-input-area {
            padding: 5px; background: #f5f9ff; border-top: 1px solid #a0b9d9;
            display: flex; gap: 5px;
        }
        .chat-input-area input {
            flex: 1; border: 1px solid #7f9db9; padding: 4px; font-family: "Tahoma", sans-serif;
        }
        .chat-actions {
            display: flex; gap: 5px; padding: 5px; justify-content: space-between;
            align-items: center; background: #eef3fc;
        }
        .btn-wizz {
            background: #ffcc00; border: 1px solid #cc9900; font-weight: bold; cursor: pointer; padding: 2px 8px; font-size: 11px;
        }
        .btn-wizz:active { background: #e6b800; }

        /* Animation Wizz */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shake-animation { animation: shake 0.5s; animation-iteration-count: 1; }

        /* Palette de couleurs */
        .color-picker { display: flex; gap: 3px; align-items: center; }
        .color-dot { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; border: 1px solid #555; }
    </style>
</head>
<body>

    <!-- 1. FENÊTRE PRINCIPALE (MSN) -->
    <div class="window msn-window" id="main-window">
        <div class="title-bar">
            <span>Windows Live Messenger</span>
            <div class="title-bar-controls">
                <button aria-label="Minimize">_</button>
                <button aria-label="Maximize">□</button>
                <button aria-label="Close" onclick="alert('Fermeture impossible 😅')">X</button>
            </div>
        </div>
        
        <div class="menu-bar">
            <div class="menu-item">Fichier</div>
            <div class="menu-item">Contacts</div>
            <div class="menu-item">Actions</div>
            <div class="menu-item">Outils</div>
            <div class="menu-item">Aide</div>
        </div>

        <div class="msn-header">
            <!-- Image du bonhomme MSN authentique -->
            <div class="user-pic"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/Windows_Live_Messenger_2009_icon.png/120px-Windows_Live_Messenger_2009_icon.png" alt="Avatar"></div>
            <div class="user-info">
                <span class="user-name">Fanta (En ligne) ▾</span>
                <span class="user-status">Tapez votre message perso...</span>
            </div>
        </div>

        <div class="search-bar">
            <input type="text" placeholder="Rechercher un contact...">
        </div>

        <div class="contact-list">
            <div class="contact-group">Amis (2/18)</div>
            
            <div class="contact-item" onclick="openChat()">
                <span class="status-icon status-online"></span>
                <span class="contact-name">Berserk68</span>
            </div>
            <div class="contact-item">
                <span class="status-icon status-away"></span>
                <span class="contact-name">Jérôme</span>
            </div>
            <div class="contact-item">
                <span class="status-icon status-offline"></span>
                <span class="contact-name">Alex</span>
            </div>
        </div>

        <div class="status-bar">
            <span>Prêt</span>
            <span>🔊 Connecté</span>
        </div>
    </div>

    <!-- 2. FENÊTRE DE CONVERSATION (CHAT) -->
    <div class="window chat-window" id="chat-window">
        <div class="title-bar">
            <span>Berserk68 - Conversation</span>
            <div class="title-bar-controls">
                <button aria-label="Minimize">_</button>
                <button aria-label="Maximize">□</button>
                <button aria-label="Close" onclick="closeChat()">X</button>
            </div>
        </div>

        <div class="chat-menu-bar">
            <div class="menu-item">Fichier</div>
            <div class="menu-item">Edition</div>
            <div class="menu-item">Actions</div>
            <div class="menu-item">Outils</div>
            <div class="menu-item">Aide</div>
        </div>
        
        <div class="window-body" style="padding: 0; margin: 0; flex: 1; display: flex; flex-direction: column;">
            <div class="chat-messages" id="messages">
                <div class="message"><span class="time">[14:02]</span> <strong>Berserk68 :</strong> Salut ! Ça fait longtemps !</div>
            </div>
            
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Tapez votre message..." autocomplete="off">
                <button onclick="sendMessage()">Envoyer</button>
            </div>

            <div class="chat-actions">
                <div class="color-picker">
                    <span style="font-size:10px; color:#555;">Couleur :</span>
                    <div class="color-dot" style="background:#eef3fc;" onclick="changeChatColor('#eef3fc')"></div>
                    <div class="color-dot" style="background:#ffcccc;" onclick="changeChatColor('#ffcccc')"></div>
                    <div class="color-dot" style="background:#ccffcc;" onclick="changeChatColor('#ccffcc')"></div>
                    <div class="color-dot" style="background:#ccccff;" onclick="changeChatColor('#ccccff')"></div>
                </div>
                <button class="btn-wizz" onclick="sendWizz()">⚡ Wizz</button>
            </div>
        </div>
    </div>

    <!-- 3. LE SCRIPT SOCKET.IO + LOGIQUE -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = "Moi";

        function openChat() {
            document.getElementById('chat-window').style.display = 'flex';
            // Son de connexion
            const audio = new Audio('assets/msn_sound.mp3');
            audio.volume = 0.5;
            audio.play().catch(e => console.log("Son de connexion non trouvé."));
        }

        function closeChat() {
            document.getElementById('chat-window').style.display = 'none';
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (message !== "") {
                socket.emit('chat message', { user: currentUser, text: message });
                input.value = '';
            }
        }

        document.getElementById('chat-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        socket.on('chat message', function(msg) {
            const messagesDiv = document.getElementById('messages');
            const newMessage = document.createElement('div');
            newMessage.classList.add('message');
            const now = new Date();
            const time = `[${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}]`;
            newMessage.innerHTML = `<span class="time">${time}</span> <strong>${msg.user} :</strong> ${msg.text}`;
            messagesDiv.appendChild(newMessage);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            // Son de message
            const audio = new Audio('assets/message.mp3');
            audio.volume = 0.3;
            audio.play().catch(e => {});
        });

        // --- WIZZ ---
        function sendWizz() {
            const audio = new Audio('assets/nudge.mp3'); 
            audio.volume = 1.0;
            audio.play().catch(e => console.log("nudge.mp3 non trouvé."));

            const chatWin = document.getElementById('chat-window');
            chatWin.classList.add('shake-animation');
            setTimeout(() => chatWin.classList.remove('shake-animation'), 500);

            socket.emit('wizz', { user: currentUser });
        }

        socket.on('wizz', function(data) {
            const chatWin = document.getElementById('chat-window');
            chatWin.classList.add('shake-animation');
            setTimeout(() => chatWin.classList.remove('shake-animation'), 500);
            
            const audio = new Audio('assets/nudge.mp3');
            audio.play().catch(e => {});
            
            const messagesDiv = document.getElementById('messages');
            const newMessage = document.createElement('div');
            newMessage.innerHTML = `<em style="color:red;">⚡ ${data.user} vous a envoyé un Wizz !</em>`;
            messagesDiv.appendChild(newMessage);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        function changeChatColor(color) {
            document.getElementById('chat-window').style.backgroundColor = color;
        }
    </script>

</body>
</html>
