<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSN Next Gen</title>
    <!-- Police moderne (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* --- RESET & BASE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body {
            /* Fond sombre profond avec une touche de bleu/violet */
            background: #0f111a;
            background-image: radial-gradient(circle at 50% -20%, #2a2d43 0%, #0f111a 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        /* --- CONTENEUR PRINCIPAL --- */
        .app-container {
            display: flex;
            gap: 16px;
            width: 850px;
            height: 600px;
        }

        /* --- PANNEAU LATÉRAL (Contacts) --- */
        .sidebar {
            width: 300px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .profile {
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .avatar {
            width: 48px; height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex; justify-content: center; align-items: center;
            font-size: 20px; font-weight: bold; color: white;
        }
        .profile-info h2 { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
        .profile-info p { font-size: 12px; color: #a1a1aa; }

        .search-box { padding: 16px 24px; }
        .search-box input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 14px;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
        }
        .search-box input:focus { border-color: #6366f1; background: rgba(0, 0, 0, 0.3); }

        .contacts-list { flex: 1; overflow-y: auto; padding: 0 12px 12px 12px; }
        .contacts-list::-webkit-scrollbar { width: 4px; }
        .contacts-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        .group-title {
            font-size: 11px; font-weight: 600; color: #71717a;
            text-transform: uppercase; letter-spacing: 0.5px;
            padding: 16px 12px 8px 12px;
        }

        .contact-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .contact-item:hover { background: rgba(255, 255, 255, 0.05); }
        
        .contact-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: #27272a; display: flex; justify-content: center; align-items: center;
            font-size: 16px;
        }
        .contact-details { display: flex; flex-direction: column; }
        .contact-name { font-size: 13px; font-weight: 500; }
        .contact-status { font-size: 11px; color: #a1a1aa; margin-top: 2px; }

        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #22c55e; margin-left: auto;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
        }

        /* --- ZONE DE CHAT --- */
        .chat-area {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            display: none; /* Caché au début */
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .chat-header {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; align-items: center; gap: 12px;
        }
        .chat-header .contact-avatar { width: 40px; height: 40px; font-size: 18px; }
        .chat-header-info h3 { font-size: 15px; font-weight: 600; }
        .chat-header-info p { font-size: 12px; color: #22c55e; }
        
        .close-chat {
            margin-left: auto; background: none; border: none;
            color: #71717a; font-size: 20px; cursor: pointer;
            transition: color 0.2s;
        }
        .close-chat:hover { color: #ef4444; }

        .messages-container {
            flex: 1; overflow-y: auto; padding: 24px;
            display: flex; flex-direction: column; gap: 16px;
        }
        .messages-container::-webkit-scrollbar { width: 4px; }
        .messages-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        /* Bulles de messages modernes */
        .message { display: flex; flex-direction: column; max-width: 75%; }
        .message.mine { align-self: flex-end; align-items: flex-end; }
        .message.other { align-self: flex-start; align-items: flex-start; }
        
        .msg-info { font-size: 11px; color: #71717a; margin-bottom: 4px; padding: 0 4px; }
        
        .msg-bubble {
            padding: 12px 16px;
            font-size: 14px;
            line-height: 1.4;
            border-radius: 16px;
        }
        .message.mine .msg-bubble {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }
        .message.other .msg-bubble {
            background: rgba(255, 255, 255, 0.08);
            color: #e4e4e7;
            border-bottom-left-radius: 4px;
        }

        .wizz-alert {
            text-align: center; font-size: 12px; color: #f59e0b;
            background: rgba(245, 158, 11, 0.1); padding: 8px 16px;
            border-radius: 20px; margin: 8px auto; display: inline-block;
        }

        /* Zone de saisie moderne */
        .input-area {
            padding: 16px 24px;
            background: rgba(0, 0, 0, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; gap: 12px; align-items: center;
        }
        .input-area input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 18px;
            border-radius: 12px;
            color: #fff; font-size: 14px;
            outline: none; transition: all 0.2s;
        }
        .input-area input:focus { border-color: #6366f1; background: rgba(255, 255, 255, 0.08); }
        
        .action-btn {
            width: 44px; height: 44px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; font-size: 18px; color: #fff;
            transition: all 0.2s;
        }
        .action-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .btn-wizz:hover { background: rgba(245, 158, 11, 0.2); border-color: #f59e0b; }
        
        .btn-send {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none; padding: 0 24px; height: 44px;
            border-radius: 12px; color: white; font-weight: 600; font-size: 14px;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-send:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

        /* Animation Wizz */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
            20%, 40%, 60%, 80% { transform: translateX(4px); }
        }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- PANNEAU CONTACTS -->
        <div class="sidebar">
            <div class="profile">
                <div class="avatar">😎</div>
                <div class="profile-info">
                    <h2>Fanta</h2>
                    <p>En ligne</p>
                </div>
            </div>
            <div class="search-box">
                <input type="text" placeholder="Rechercher...">
            </div>
            <div class="contacts-list">
                <div class="group-title">En ligne (2)</div>
                
                <div class="contact-item" onclick="openChat('Alex', '🐻')">
                    <div class="contact-avatar">🐻</div>
                    <div class="contact-details">
                        <span class="contact-name">Alex</span>
                        <span class="contact-status">Écoute Spotify</span>
                    </div>
                    <div class="status-dot"></div>
                </div>
                
                <div class="contact-item" onclick="openChat('Sophie', '👩‍🦰')">
                    <div class="contact-avatar">👩‍🦰</div>
                    <div class="contact-details">
                        <span class="contact-name">Sophie</span>
                        <span class="contact-status">Disponible</span>
                    </div>
                    <div class="status-dot"></div>
                </div>
            </div>
        </div>

        <!-- ZONE DE CHAT -->
        <div class="chat-area" id="chat-area">
            <div class="chat-header">
                <div class="contact-avatar" id="header-avatar">🐻</div>
                <div class="chat-header-info">
                    <h3 id="header-name">Alex</h3>
                    <p>En ligne</p>
                </div>
                <button class="close-chat" onclick="closeChat()">✕</button>
            </div>

            <div class="messages-container" id="messages">
                <!-- Les messages s'affichent ici -->
            </div>

            <div class="input-area">
                <button class="action-btn btn-wizz" onclick="sendWizz()" title="Wizz">⚡</button>
                <input type="text" id="chat-input" placeholder="Écrivez votre message..." autocomplete="off">
                <button class="btn-send" onclick="sendMessage()">Envoyer</button>
            </div>
        </div>
    </div>

    <!-- LOGIQUE JS -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = "Moi";

        function openChat(name, avatar) {
            document.getElementById('header-name').textContent = name;
            document.getElementById('header-avatar').textContent = avatar;
            document.getElementById('chat-area').style.display = 'flex';
            document.getElementById('messages').innerHTML = ''; // Reset chat
            
            // Son d'ouverture (optionnel)
            const audio = new Audio('assets/msn_sound.mp3');
            audio.volume = 0.3;
            audio.play().catch(e => {});
        }

        function closeChat() {
            document.getElementById('chat-area').style.display = 'none';
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (text) {
                addMessage(currentUser, text, 'mine');
                socket.emit('chat message', { user: currentUser, text: text });
                input.value = '';
            }
        }

        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        socket.on('chat message', (msg) => {
            if (msg.user === currentUser) return;
            addMessage(msg.user, msg.text, 'other');
            
            // Son de réception
            const audio = new Audio('assets/message.mp3');
            audio.volume = 0.2;
            audio.play().catch(e => {});
        });

        function addMessage(sender, text, type) {
            const container = document.getElementById('messages');
            const now = new Date();
            const time = `${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;
            msgDiv.innerHTML = `
                <span class="msg-info">${sender} • ${time}</span>
                <div class="msg-bubble">${text}</div>
            `;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function sendWizz() {
            const audio = new Audio('assets/nudge.mp3');
            audio.play().catch(e => {});
            
            const chatArea = document.getElementById('chat-area');
            chatArea.classList.add('shake');
            setTimeout(() => chatArea.classList.remove('shake'), 400);

            const container = document.getElementById('messages');
            const wizzDiv = document.createElement('div');
            wizzDiv.style.textAlign = 'center';
            wizzDiv.innerHTML = `<span class="wizz-alert">⚡ ${currentUser} vous a envoyé un Wizz !</span>`;
            container.appendChild(wizzDiv);
            container.scrollTop = container.scrollHeight;

            socket.emit('wizz', { user: currentUser });
        }

        socket.on('wizz', (data) => {
            const chatArea = document.getElementById('chat-area');
            chatArea.classList.add('shake');
            setTimeout(() => chatArea.classList.remove('shake'), 400);
            
            const audio = new Audio('assets/nudge.mp3');
            audio.play().catch(e => {});
            
            const container = document.getElementById('messages');
            const wizzDiv = document.createElement('div');
            wizzDiv.style.textAlign = 'center';
            wizzDiv.innerHTML = `<span class="wizz-alert">⚡ ${data.user} vous a envoyé un Wizz !</span>`;
            container.appendChild(wizzDiv);
            container.scrollTop = container.scrollHeight;
        });
    </script>
</body>
</html>
